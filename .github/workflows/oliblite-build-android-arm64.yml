name: Build Android APK

# Actions are pinned to commit SHAs (tag in a trailing comment) so a
# moved tag cannot change what runs. To bump an action, resolve the
# new tag's commit SHA and update both the SHA and the comment.

# Triggered by:
#   - pushing to main / opening a PR → `check` job only (analyze + test)
#   - pushing a vX.Y.Z tag           → `check`, then `build` creates a
#                                      GitHub Release with APKs attached
#   - manual workflow_dispatch       → `check`, then `build` uploads APKs
#                                      as workflow artifact only
#
# Required secrets (configure in repo Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64        base64-encoded contents of olib-release-key.jks
#                          generate locally with: base64 -w 0 android/app/olib-release-key.jks
#   KEYSTORE_PASSWORD      storePassword from android/key.properties
#   KEY_PASSWORD           keyPassword from android/key.properties
#   KEY_ALIAS              keyAlias from android/key.properties (currently "olib")
#
# NOTE: olib_api_plugin is NO LONGER fetched from a private repo.
# The package now lives in this repo at vendor/olib_api_plugin/ (a
# clean-room rewrite of the Z-Library client). No deploy key is needed
# and no clone step runs; the step below only verifies the directory
# is present before flutter pub get resolves the path dependency.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual build (for traceability)'
        required: false
        default: 'Manual build'

# Default to read-only; only the release step inside `build` needs
# write, and it gets it from the job-level override below.
permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: analyze + test on every push to main and every PR, so a
  # broken commit is caught at push time instead of at the next manual
  # build. No secrets, no keystore, no APK — pure Dart checks.
  check:
    name: Check (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Cache pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Strict-lint ratchet (M8 + O12): runs the stricter profile
      # (analysis_options_strict.yaml) and FAILS the check when the
      # finding count rises above the baseline in
      # scripts/strict_lint_baseline.txt — the count may only go down,
      # never up. To lower the baseline, fix findings first, then drop
      # the baseline file to the new measured count in the same commit.
      # Fix findings per directory, then promote rules that hit zero
      # into analysis_options.yaml so the blocking step enforces them.
      # dart analyze has no --options override, so the file is swapped
      # in for the duration of this step and restored right after.
      - name: Strict lint ratchet
        run: |
          cp analysis_options.yaml analysis_options.base.yaml
          cp analysis_options_strict.yaml analysis_options.yaml
          dart analyze lib vendor/olib_api_plugin/lib | tee strict_lint.log || true
          cp analysis_options.base.yaml analysis_options.yaml
          count=$(grep -cE '(info|warning|error) - ' strict_lint.log || echo 0)
          baseline=$(cat scripts/strict_lint_baseline.txt)
          echo "Strict-profile findings: $count (baseline: $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "::error::Strict-lint findings rose to $count (baseline $baseline). Fix findings to bring the count back down — the baseline only moves down, never up."
            exit 1
          fi

  build:
    name: Build release APK
    # Only tag pushes (release) and manual dispatch (artifact) build.
    # Pushes to main and PRs run `check` only. `needs: check` gates the
    # release on a green analyze + test.
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write  # needed to create a Release on tag pushes
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Cache pub
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # Only the pub cache: caching .dart_tool can carry stale
          # generated state into the build.
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter dependencies
        run: flutter pub get

      # No Analyze/Test here (O12): the `check` job runs them on the
      # same commit and `needs: check` gates this build on a green
      # check, so re-running them only costs time.
      - name: Read version from pubspec
        id: pubspec
        run: |
          full=$(grep '^version:' pubspec.yaml | sed 's/version:\s*//' | tr -d ' ')
          version=${full%+*}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Building version: $full"

      - name: Verify tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
          PUBSPEC_VERSION: ${{ steps.pubspec.outputs.version }}
        run: |
          expected="v$PUBSPEC_VERSION"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag '$TAG' does not match pubspec version '$expected'. Run scripts/bump_version.js first."
            exit 1
          fi

      # olib_api_plugin 现在是仓库内代码（vendor/olib_api_plugin/），pubspec
      # 用 path 依赖。只核对目录在场，不再 clone 私有仓库、不跑 codegen
      #（重写版模型是手写代码，没有 build_runner 生成文件）。
      - name: Verify in-repo olib_api_plugin
        run: |
          if [ ! -f vendor/olib_api_plugin/pubspec.yaml ] || [ ! -f vendor/olib_api_plugin/lib/olib_api_plugin.dart ]; then
            echo "::error::vendor/olib_api_plugin/ is missing from the repo. It must be committed (check .gitignore does not exclude vendor/)."
            exit 1
          fi
          echo "olib_api_plugin present in repo:"
          ls vendor/olib_api_plugin/lib/ vendor/olib_api_plugin/lib/src/

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Set it before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/olib-release-key.jks
          # build.gradle.kts reads key.properties from the android/ dir.
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=olib-release-key.jks"
          } > android/key.properties
          echo "Keystore restored. File sizes:"
          wc -c android/app/olib-release-key.jks android/key.properties

      - name: Build release APK
        # --obfuscate renames Dart symbols in the shipped snapshot (smaller
        # + harder to read); the mapping lands in the --split-debug-info
        # directory and is uploaded as a separate artifact below, so crash
        # de-symbolization keeps working.
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Rename APK and compute checksum
        id: artifacts
        run: |
          cd build/app/outputs/flutter-apk
          v="${{ steps.pubspec.outputs.version }}"

          # Rename to a clean, human-readable filename
          mv app-release.apk "zlibx-v$v.apk"

          # Drop any leftover unsigned/intermediate artifacts
          rm -f *.apk.sha1 *-debug.apk

          echo "Output files:"
          ls -lh

          sha256sum *.apk > sha256sums.txt
          echo "--- sha256sums.txt ---"
          cat sha256sums.txt

          # Record the APK size in the run summary so consecutive builds
          # can be compared without downloading the artifact.
          apk_bytes=$(stat -c%s *.apk)
          echo "APK size: ${apk_bytes} bytes" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify keystore signature
        run: |
          cd build/app/outputs/flutter-apk
          v="${{ steps.pubspec.outputs.version }}"
          apk="zlibx-v$v.apk"
          # build-tools includes apksigner; pick the latest available version
          apksigner_bin=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner not found, cannot verify signature"
            exit 1
          fi
          "$apksigner_bin" verify --print-certs "$apk"

      - name: Cleanup signing material (defence in depth)
        if: always()
        run: |
          rm -f android/app/olib-release-key.jks android/key.properties
          echo "Signing material removed from runner."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zlibx-android-v${{ steps.pubspec.outputs.version }}
          path: |
            build/app/outputs/flutter-apk/zlibx-*.apk
            build/app/outputs/flutter-apk/sha256sums.txt
          retention-days: 30

      # --obfuscate 的符号映射表（app.android-arm64.symbols）：单独存一份
      # 构建产物，和 APK 同样的 30 天保留期；发布版崩溃堆栈靠它反解。
      # 仓库本身是开源的，映射表只把已公开的源码符号名对应回去，不泄露
      # 任何新东西，所以打 tag 时下面 Release 里也放一份（永久保存）。
      - name: Upload Dart symbols for de-obfuscation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zlibx-android-v${{ steps.pubspec.outputs.version }}-symbols
          path: build/app/outputs/symbols
          retention-days: 30

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: zlibx ${{ github.ref_name }}
          # 正文不由工作流生成：发版时在草稿里写好说明；
          # action 更新已有 Release 时 body 为空会保留原正文。
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/zlibx-*.apk
            build/app/outputs/flutter-apk/sha256sums.txt
            build/app/outputs/symbols/*
