# Staged, NOT enforced by CI: a stricter lint profile to triage gradually.
#
# CI runs this profile as a BLOCKING ratchet step ("Strict lint ratchet"):
# the finding count must not rise above the baseline in
# scripts/strict_lint_baseline.txt — the count may only go down, never
# up (dart analyze has no --options override, so CI swaps this file in
# for that step).
#
# PROMOTED into analysis_options.yaml (enforced, blocking) after the
# codebase reached zero findings on them — M8 batch 1, 2026-11-14:
# strict-casts, strict-raw-types, use_build_context_synchronously,
# cancel_subscriptions, close_sinks, prefer_final_locals.
#
# Baseline (enforced by the ratchet step from
# scripts/strict_lint_baseline.txt; 2026-11-14, lib/, fresh gen-l10n
# output): 289 findings — avoid_catches_without_on_clauses 152,
# directives_ordering 136 (+1 in the vendor plugin). Re-measured
# 2026-11-14 from the CI ratchet run (43562413562): the review's 262 was
# counted on an older tree and undercounts by 27. Batch-1 notes:
#  * avoid_catches_without_on_clauses stays in triage BY DESIGN: the
#    codebase deliberately catches broadly at network/parse boundaries
#    and routes through logIgnored; typing all 152 sites would churn
#    without adding safety. Revisit only if a typed-catch refactor is
#    actually planned.
#  * directives_ordering: mechanical but wide (136 sites); batch it per
#    directory. No dart fix exists for it.
#  * The 2 SDK-skew artifacts (SizeTransition alignment, cupertino
#    import) only appear on the local 3.41.8 toolchain — CI (3.44.0) is
#    clean and they are NOT counted in the baseline.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - use_build_context_synchronously
    - avoid_catches_without_on_clauses
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - directives_ordering
