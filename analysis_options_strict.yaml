# Staged, NOT enforced by CI: a stricter lint profile to triage gradually.
#
# CI runs this profile as a NON-BLOCKING step ("Strict lint triage") that
# reports the finding count on every push/PR (dart analyze has no
# --options override, so CI swaps this file in for that step).
#
# Baseline 2026-11-13 (lib/, fresh gen-l10n output): 285 findings —
# avoid_catches_without_on_clauses 149, directives_ordering 103,
# strict_raw_type 15, prefer_final_locals 9, strict-casts 5, misc 4.
# Fix per directory; when a rule hits zero, promote it into
# analysis_options.yaml so `flutter analyze` enforces it there.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - unawaited_futures
    - use_build_context_synchronously
    - avoid_catches_without_on_clauses
    - cancel_subscriptions
    - close_sinks
    - prefer_final_locals
    - directives_ordering
