# 4G heap / 1G metaspace: the old 8G/4G got the daemon OOM-killed on
# 8 GB machines before the build even started. CI (ubuntu-latest, 16 GB)
# and desktops both build comfortably within this; per-invocation
# overrides stay possible with GRADLE_OPTS for a specific task.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier off: every plugin in this project is already AndroidX.
# If a future plugin still ships the old support library, flip this
# back to true and note which plugin needs it.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Plugins (rive_native, etc.) compile Java/Kotlin at
# inconsistent JVM targets. ART/D8 handle the mix fine; downgrade KGP's strict
# validation so the build doesn't fail on this. Don't force-align via JavaCompile
# task overrides — that strips android.jar from the bootclasspath.
kotlin.jvm.target.validation.mode=ignore
