name: zlibx
description: "zlibx: an open-source third-party ebook client for Z-Library, Anna's Archive and LibGen (Flutter + Rust parsers)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.7.3+10703

environment:
  sdk: ^3.10.0
  # 本地与 CI 同源：CI 用 Flutter 3.44.0（见 .github/workflows），本地也用它
  #（.fvmrc 固定 3.44.0；没装 fvm 就按这个版本装）。
  flutter: ">=3.44.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # gen-l10n migration (item 8, step 1): provisional direct dependency.
  # Already resolved transitively at 0.20.2 via flutter_localizations;
  # the generated code for this message set may not import intl at all
  # (no plurals/dates), in which case this line can be dropped later.
  intl: ^0.20.2

  # UI & Icons
  cached_network_image: ^3.3.1
  # Material You dynamic color (Android 12+): ColorScheme from the wallpaper,
  # falls back to the built-in palette where dynamic color is unavailable.
  # 曾 pin 在 <1.9.0：v1.9.0 的 android/build.gradle.kts 用 `kotlin { compilerOptions {} }`
  # DSL，在本地旧 Flutter 3.41.x 的 Gradle/Kotlin 配置下编译失败；CI 的 Flutter 3.44
  # 下可编译。工具链已对齐到 3.44.0，上限解除。
  dynamic_color: ^1.7.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # HTTP & Network
  dio: ^5.4.3+1
  # Imported directly by lib/services/libgen_service.dart and
  # lib/services/annas_archieve.dart (used to be transitive-only).
  # 曾放宽到 >=1.17.0：Flutter 3.41.x 把 meta pin 在 1.17.0，^1.18.0 会让旧本地
  # 工具链 pub get 失败。工具链已对齐到 3.44.0（SDK 自带 meta 1.18.0，lock 已是
  # 1.18.0），恢复 ^1.18.0。API（@visibleForTesting 等）在两个版本间相同。
  meta: ^1.18.0

  # Privacy lock (隐私锁): system BiometricPrompt — fingerprint / face,
  # falling back to the device credential. Requires MainActivity to be
  # a FlutterFragmentActivity (see MainActivity.kt).
  local_auth: ^2.3.0
  # HTML parsing for the external book sources (Anna's Archive / LibGen).
  html: ^0.15.6
  
  # Rust HTML parser bridge (primary parse path). The Rust crate lives at
  # rust/zlibx_parsers/; flutter_rust_bridge generates the Dart↔Rust bindings
  # (frb_generated.dart) at build time. The Z-Library parsers
  # (vendor/olib_api_plugin) route through this bridge, with the Dart
  # implementations as fallback.
  flutter_rust_bridge: 2.14.0-beta.2

  # Storage
  # Backup & restore (plan item 17): archive packs the boxes into one zip;
  # cryptography (+ its Flutter companion, which delegates PBKDF2/AES-GCM
  # to javax.crypto on Android) encrypts the secrets envelope.
  # NOTE: pubspec.lock is NOT refreshed in this change (no local Flutter
  # toolchain); CI runs plain `flutter pub get`, which resolves these.
  archive: ^4.7.1
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Credentials (account session, backend token) live here, never in Hive:
  # flutter_secure_storage is backed by Android Keystore / iOS Keychain.
  # ^11.2.0 (not ^9.0.0): v9's Windows impl pins win32 ^5.0.0, which
  # conflicted with file_picker's win32 ^6.3.0 and broke `flutter pub
  # get` (run #3 failure 2026-11-05); v11 (win32 ^6.0.1) resolves it.
  flutter_secure_storage: ^11.2.0

  path_provider: ^2.1.4
  # Direct dependency: lib/services/txt_to_epub.dart and
  # lib/services/web_service.dart import package:path, and tests use it too
  # (pending_uri_writer_test joins temp paths). Already resolved transitively
  # at 1.9.1; declared directly so the analyzer's
  # depend_on_referenced_packages check passes.
  path: ^1.9.1
  open_filex: ^4.4.0
  share_plus: ^13.1.0
  url_launcher: ^6.2.5
  android_intent_plus: ^6.0.0

  package_info_plus: ^10.1.0
  # Stable 13.3.2 (was 12.0.0-beta.7). Only used for choosing the download
  # directory (settings/download_path_section.dart). win32 ^6.3.0 via
  # windows_file_picker, compatible with flutter_secure_storage ^11.2.0.
  file_picker: ^13.3.2
  flutter_inappwebview: ^6.1.5

  # ISBN barcode scanning (扫码搜书): ML Kit on-device barcode scan.
  mobile_scanner: ^7.5.0

  # App icon shortcuts (长按图标快捷方式): 扫码 / 搜索 / 书单 /
  # 我的图书馆. Android dynamic shortcuts via ShortcutManager;
  # a no-op on iOS (no launcher-icon shortcuts there).
  quick_actions: ^1.1.0

  # App's own Z-Library client + data models, rewritten in-repo at
  # vendor/olib_api_plugin/ (committed to the repo; CI verifies it).
  olib_api_plugin:
    path: vendor/olib_api_plugin
  connectivity_plus: ^7.3.2

  # LAN web service (设置 → Web 服务): QR code for the address, EPUB
  # packing for the TXT reader, GBK / GB18030 decoding for Chinese TXT.
  qr_flutter: ^4.1.0
  chinese_codec: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lints
  flutter_lints: ^5.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.2

# App Icon Configuration
flutter_launcher_icons:
  android: true
  image_path: "tool/icons/olib-app-logo.png"
  adaptive_icon_background: "#FFEBCC"
  adaptive_icon_foreground: "tool/icons/olib-app-logo.png"
  # NOTE: the Android 13+ monochrome layer (桌面上的"动态取色图标") is NOT
  # generated by this tool. It is a hand-maintained VectorDrawable at
  # android/app/src/main/res/drawable/ic_launcher_monochrome.xml, traced from
  # tool/icons/olib-app-logo-monochrome.png. Do not set
  # `adaptive_icon_monochrome`: the generator would emit bitmap layers
  # (ic_launcher_monochrome.png), and a bitmap monochrome layer is ignored by
  # some OEM launchers (Honor/MagicOS) — the icon would silently stop
  # following the wallpaper palette again. After running this generator,
  # re-add the <monochrome> element to res/mipmap-anydpi-v26/ic_launcher.xml.
  min_sdk_android: 29

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # gen-l10n (item 8): generate localizations from lib/l10n/*.arb
  # (see l10n.yaml) at `flutter pub get` time.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Vendored foliate-js for the web reader (see assets/web-reader/VENDORED.md).
  assets:
    - assets/web-reader/
    - assets/web-reader/vendor/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
